# Local development defaults (non-secret). Override secrets via env or local application-local.yml
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/mockwise}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: HikariPool
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 10000
      max-lifetime: 60000
      connection-timeout: 30000
      leak-detection-threshold: 20000
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: false

logging:
  level:
    com.mockwise.backend: INFO
    com.zaxxer.hikari: INFO

# Provide secrets via environment variables in real use:
# SUPABASE_URL, SUPABASE_ANON_KEY, SUPABASE_SERVICE_KEY, CLAUDE_API_KEY, JUDGE0_API_KEY
supabase:
  url: ${SUPABASE_URL:}
  anon:
    key: ${SUPABASE_ANON_KEY:}
  service:
    key: ${SUPABASE_SERVICE_KEY:}

claude:
  api:
    key: ${CLAUDE_API_KEY:}

judge0:
  api:
    key: ${JUDGE0_API_KEY:}
