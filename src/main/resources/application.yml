# =============================================================================
# application.yml — SHARED defaults (all environments)
# =============================================================================
# Active profile selects environment-specific overrides:
#   local  → application-local.yml   (laptop / local Postgres)
#   prod   → application-prod.yml    (deployed / managed Postgres)
#   test   → src/test/.../application-test.yml  (H2, automatic in tests)
#
# Override the default with:
#   export SPRING_PROFILES_ACTIVE=local   # or prod
#   ./mvnw clean spring-boot:run
#
# After deleting/renaming config files, always `mvn clean` — Maven does not remove
# orphaned files under target/classes, and a stale application.properties can force
# an old profile (e.g. dev → database "mockwise").
# =============================================================================

spring:
  application:
    name: mockwise-backend
  profiles:
    # Default for `./mvnw spring-boot:run` with no env set → local machine.
    active: ${SPRING_PROFILES_ACTIVE:local}
    # When profile "local" is active, also load optional machine secrets if present.
    # File: application-local-secrets.yml (gitignored). Missing file is fine.
    group:
      local:
        - local-secrets
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 10
          lob:
            non_contextual_creation: true
        order_inserts: true
        order_updates: true
  flyway:
    # Schema is still owned by Hibernate ddl-auto until Flyway is baselined.
    enabled: false

# Set true to skip Supabase JWT auth (local guest user). Restore with false.
mockwise:
  auth:
    disabled: ${MOCKWISE_AUTH_DISABLED:false}

server:
  port: ${PORT:8080}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  base-url: ${APP_BASE_URL:http://localhost:8080}
  frontend-url: ${APP_FRONTEND_URL:http://localhost:5173}

claude:
  api:
    url: ${CLAUDE_API_URL:https://api.anthropic.com}
  model: ${CLAUDE_MODEL:claude-sonnet-4-20250514}
  max-tokens: ${CLAUDE_MAX_TOKENS:1500}

judge0:
  api:
    url: ${JUDGE0_API_URL:https://judge0-ce.p.rapidapi.com}
