spring:
  application:
    name: mockwise-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 10
          lob:
            non_contextual_creation: true
        order_inserts: true
        order_updates: true
  flyway:
    enabled: false

server:
  port: ${PORT:8080}

app:
  base-url: ${APP_BASE_URL:http://localhost:8080}
  frontend-url: ${APP_FRONTEND_URL:http://localhost:5173}

claude:
  api:
    url: ${CLAUDE_API_URL:https://api.anthropic.com}

judge0:
  api:
    url: ${JUDGE0_API_URL:https://judge0-ce.p.rapidapi.com}

# Secrets and environment-specific values live in profile files / env vars.
