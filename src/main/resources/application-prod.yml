# =============================================================================
# application-prod.yml — PRODUCTION deployment
# Profile name: prod
# Activate: SPRING_PROFILES_ACTIVE=prod  (required on Railway/Docker)
# =============================================================================
# Intent: managed Postgres + secrets only from environment variables.
# Missing required env vars should fail fast at startup rather than use insecure defaults.
# =============================================================================

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME:}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: HikariPool-prod
      # Prefer Supabase/Railway session pooler URL; keep pool modest.
      maximum-pool-size: ${HIKARI_MAX_POOL:10}
      minimum-idle: ${HIKARI_MIN_IDLE:2}
      idle-timeout: 120000
      max-lifetime: 240000
      connection-timeout: 20000
      leak-detection-threshold: 20000
  jpa:
    hibernate:
      # Refuse to mutate schema in production. Prefer Flyway once baselined.
      ddl-auto: validate
    show-sql: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    # Flip to true after baseline (see docs/architecture.md).
    enabled: ${FLYWAY_ENABLED:false}
    baseline-on-migrate: true

logging:
  level:
    root: INFO
    com.mockwise.backend: INFO
    com.zaxxer.hikari: WARN
    org.hibernate.SQL: WARN

supabase:
  url: ${SUPABASE_URL}
  anon:
    key: ${SUPABASE_ANON_KEY}
  service:
    key: ${SUPABASE_SERVICE_KEY}

claude:
  api:
    key: ${CLAUDE_API_KEY}

judge0:
  api:
    key: ${JUDGE0_API_KEY:}
