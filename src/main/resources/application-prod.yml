spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: HikariPool
      maximum-pool-size: ${HIKARI_MAX_POOL:20}
      minimum-idle: ${HIKARI_MIN_IDLE:5}
      idle-timeout: 10000
      max-lifetime: 60000
      connection-timeout: 30000
      leak-detection-threshold: 20000
  jpa:
    hibernate:
      # Prefer Flyway-owned schema in production once baseline is applied.
      ddl-auto: validate
    show-sql: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    # Enable after running baseline against existing DB (see docs/architecture.md).
    enabled: ${FLYWAY_ENABLED:false}
    baseline-on-migrate: true

logging:
  level:
    root: INFO
    com.mockwise.backend: INFO

supabase:
  url: ${SUPABASE_URL}
  anon:
    key: ${SUPABASE_ANON_KEY}
  service:
    key: ${SUPABASE_SERVICE_KEY}

claude:
  api:
    key: ${CLAUDE_API_KEY}

judge0:
  api:
    key: ${JUDGE0_API_KEY:}
