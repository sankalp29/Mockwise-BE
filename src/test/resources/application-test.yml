# =============================================================================
# application-test.yml — AUTOMATED TESTS only (src/test/resources)
# Profile name: test  (set via @ActiveProfiles("test"))
# =============================================================================
# Intent: isolated in-memory H2 so unit/integration tests never touch real DBs.
# =============================================================================

spring:
  datasource:
    url: jdbc:h2:mem:mockwise_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
    hikari:
      pool-name: HikariPool-test
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 10000
      leak-detection-threshold: 5000
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    open-in-view: false
    show-sql: false
  flyway:
    enabled: false

supabase:
  url: http://localhost
  anon:
    key: test-anon
  service:
    key: test-service

claude:
  api:
    key: test-key

judge0:
  api:
    key: test-key

mockwise:
  auth:
    disabled: false

logging:
  level:
    root: WARN
    com.mockwise.backend: INFO
